<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторний проект: Фільмова база</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        input, select {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        #error-container {
            color: red;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }
        #loader {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .movie-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .movie-card {
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .movie-card:hover {
            transform: translateY(-5px);
        }
        .movie-card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }
        .movie-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .movie-title {
            margin: 0 0 10px 0;
            font-size: 1.2em;
        }
        .movie-rating {
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 10px;
        }
        .movie-genres {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-bottom: 15px;
        }
        /* Обрізаємо опис до 4 рядків */
        .movie-summary {
            font-size: 0.9em;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 Фільмова база (TV Maze API)</h1>
    </header>

    <!-- Елементи управління (UI) -->
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Пошук за назвою...">
        <select id="sortSelect">
            <option value="default">Сортування за замовчуванням</option>
            <option value="rating">За рейтингом (від найвищого)</option>
            <option value="az">За алфавітом (А-Я)</option>
            <option value="za">За алфавітом (Я-А)</option>
        </select>
    </div>

    <!-- Контейнери для повідомлень та даних -->
    <div id="error-container"></div>
    <div id="loader">Завантаження даних...</div>
    <div id="movies" class="movie-container"></div>

    <script src="script.js"></script>
</body>
</html>
