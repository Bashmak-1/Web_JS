<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практична робота 7: Робота з даними</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9f9f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        pre { background: #272822; color: #f8f8f2; padding: 15px; border-radius: 5px; overflow-x: auto; }
        
        /* Стилі для To-Do List */
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        #taskInput { flex-grow: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        #addTask { padding: 10px 15px; font-size: 16px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #addTask:hover { background-color: #27ae60; }
        
        #taskList { list-style-type: none; padding: 0; }
        #taskList li { background: #ecf0f1; margin-bottom: 10px; padding: 10px 15px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .delete-btn:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Практична робота №7</h1>
        
        <h2>Завдання 2 і 3. Масиви та JSON</h2>
        <pre>Відкрийте консоль розробника (F12), щоб побачити результати роботи map, filter, reduce та JSON.</pre>

        <hr>

        <h2>Завдання 4. Інтерактивний To-Do List (localStorage)</h2>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Введіть нове завдання...">
            <button id="addTask">Додати</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
